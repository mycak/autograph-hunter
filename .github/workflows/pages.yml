name: Publish dashboard
on:
  push:
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh offers']
    types: [completed]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for artifact metadata
        env:
          GH_ACTIONS_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os, time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          # Upload may finish before the artifact appears in the REST listing.
          name = os.environ['PAGES_ARTIFACT_NAME']
          url = (os.environ['GH_API_URL'] + '/repos/' + os.environ['GH_REPOSITORY']
                 + '/actions/runs/' + os.environ['GH_RUN_ID'] + '/artifacts?' + urlencode({'name': name}))
          headers = {'Authorization': 'Bearer ' + os.environ['GH_ACTIONS_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'Cache-Control': 'no-cache'}
          for attempt in range(10):
              try:
                  with urlopen(Request(url, headers=headers), timeout=10) as response:
                      artifacts = json.load(response).get('artifacts', [])
                  if any(a.get('name') == name and not a.get('expired') for a in artifacts):
                      # deploy-pages uses a different artifact index from REST.
                      time.sleep(12)
                      print('Uploaded Pages artifact is visible.')
                      break
              except Exception:
                  pass  # Never print authorization headers or provider response bodies.
              if attempt == 9:
                  raise SystemExit('Pages artifact metadata is unavailable; deployment was not started.')
              time.sleep(3)
          PY
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
